name: 🖥️ Compilar ejecutables desktop

# Se ejecuta en cada push a main, con tags v* (para la Release) o manualmente
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.nombre }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nombre: PlataformaTotal-Windows, icon: assets/icono.ico,  adddata: "assets/icono.png;assets" }
          - { os: macos-latest,   nombre: PlataformaTotal-macOS,   icon: assets/icono.icns, adddata: "assets/icono.png:assets" }
          - { os: ubuntu-latest,  nombre: PlataformaTotal-Linux,   icon: assets/icono.png,  adddata: "assets/icono.png:assets" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias + PyInstaller
        run: pip install -r requirements.txt pyinstaller

      - name: Compilar ejecutable (con icono)
        run: pyinstaller --noconfirm --clean --windowed --icon "${{ matrix.icon }}" --add-data "${{ matrix.adddata }}" --collect-all customtkinter --name PlataformaTotal main.py

      - name: Empaquetar (Linux/macOS)
        if: runner.os != 'Windows'
        run: cd dist && tar -czf ${{ matrix.nombre }}.tar.gz PlataformaTotal*

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\PlataformaTotal -DestinationPath dist\${{ matrix.nombre }}.zip

      - name: Subir artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/PlataformaTotal*
          retention-days: 30

  # 📦 Release permanente: al hacer push de un tag (git tag v3.0 && git push origin v3.0)
  # publica los 3 ejecutables en github.com/TU-USUARIO/REPO/releases (sin caducidad)
  release:
    name: 📦 Release permanente
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Crear GitHub Release con los ejecutables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          gh release create "${GITHUB_REF_NAME}" *.zip *.tar.gz \
            --title "🎓 PlataformaTotal ${GITHUB_REF_NAME}" \
            --notes "Ejecutables desktop — **Windows**: descomprime el .zip y doble clic en \`PlataformaTotal.exe\` (SmartScreen: 'Más información' → 'Ejecutar de todas formas'). **macOS/Linux**: descomprime el .tar.gz y ejecuta el binario."
